[package]
name = "tauri-plugin-permissions"
version = "0.1.0"
authors = ["Nova IDE"]
description = "Android runtime storage permissions for Nova IDE (Tauri v2 mobile plugin)"
edition = "2021"
links = "tauri-plugin-permissions"

[lib]
name = "tauri_plugin_permissions"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = [] }
